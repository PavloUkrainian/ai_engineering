name: AI Engineering CI - RAG Evals & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit & Regression Tests (Steps 1-4)
      run: |
        python -m unittest discover tests

    - name: Run Step 1 - Ingestion & Chunking
      run: |
        python src/run_step1.py

    - name: Run Step 2 - Retrieval Benchmark (Dense vs Hybrid vs Rerank)
      run: |
        python src/eval_retrieval.py

    - name: Run Step 4 - RAG Evals Suite & CI Quality Gates
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy_key' }}
        USE_MOCK_FALLBACK: ${{ secrets.OPENAI_API_KEY == '' && 'true' || 'false' }}
      run: |
        python src/run_evals.py --ci-mode

    - name: Upload Evaluation Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rag-evaluation-results
        path: |
          results/*.json
          data/manifest.json
